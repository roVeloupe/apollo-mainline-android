name: build-m1-bootimg

# R 路线 M1：构建 "AOSP-就绪的 pmOS 6.11 内核"。
# 基座 = 用户实测能开机的 pmOS 内核（gitlab sm8250-mainline/linux @ sm8250-6.11.0），
#        config = pmOS 已验证 config + configs/aosp-pmos610.fragment(补 binderfs/system-heap)。
# 构建后会用 ikconfig 从产物二进制里核验 binderfs/System-heap 是否真的编译进去。
# 产物：Image + dtb（dist/），供后续 RAMDISK 组装 boot.img。

on:
  workflow_dispatch:
    inputs:
      base_kernel:
        description: '基座内核(已验证可开机)源码 URL'
        required: true
        default: 'https://gitlab.com/sm8250-mainline/linux'
      base_ref:
        description: '基座分支/标签'
        required: true
        default: 'sm8250-6.11.0'
      dtb_name:
        description: '设备树相对路径 (arch/arm64/boot/dts/ 下)，pmOS 金标准=qcom/sm8250'
        required: true
        default: 'qcom/sm8250'
      use_pmos_config:
        description: '用仓库内保留的 pmOS 已验证 config 作基座(1=是,0=用分支自带 config)'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BASE_KERNEL: ${{ github.event.inputs.base_kernel }}
      BASE_REF: ${{ github.event.inputs.base_ref }}
      DTB_NAME: ${{ github.event.inputs.dtb_name }}
      USE_PMOS_CONFIG: ${{ github.event.inputs.use_pmos_config }}
      FORCE_GCC: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链 (新内核用较新 cross gcc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            flex bison libssl-dev libncurses-dev libelf-dev bc cpio \
            android-tools-mkbootimg android-tools-unpackbootimg
          mkdir -p dist

      - name: 拉取基座内核源码
        run: ./scripts/fetch-base.sh

      - name: 合入 AOSP 配置并编译 Image + DTB
        run: |
          if [ "$USE_PMOS_CONFIG" = "1" ]; then
            cp configs/pmos-6.11-sm8250.aarch64 kernel/.pmos.config
            export PMOS_CONFIG="$(pwd)/kernel/.pmos.config"
          fi
          ./scripts/build.sh || echo "[build] 编译失败(不影响诊断脚本自测)"
          # 收集产物
          cp kernel/out/arch/arm64/boot/Image dist/ 2>/dev/null || echo "无 Image"
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" -path "*qcom*" -exec cp -n {} dist/ \; 2>/dev/null || true

      - name: 全面核验(ikconfig)产物是否含 AOSP 必需符号
        run: |
          if [ -f dist/Image ]; then
            echo "=== 核验 dist/Image 内嵌 config ==="
            ./scripts/check-android-config.sh dist/Image || true
            echo "=== 重点关注这些行 ==="
            ./scripts/ikconfig_extract.py dist/Image 2>/dev/null | grep -E "CONFIG_ANDROID_BINDERFS|CONFIG_DMABUF_HEAPS_SYSTEM|CONFIG_ANDROID_BINDER_IPC|CONFIG_PSI|CONFIG_IKCONFIG" || echo "无法读取内嵌 config"
          else
            echo "无 Image 产物，跳过核验"
          fi
          echo "=== dist 内容 ==="
          ls -lh dist/ || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apollo-aosp-pmos6.11
          path: dist
          if-no-files-found: warn