# apollo.conf
#
# apollo (Redmi K30S Ultra / Xiaomi Mi 10T, SM8250/kona) boot image 参数。
#
# 依据：
#   - LineageOS android_device_xiaomi_sm8250-common (lineage-23.2), 非 VAB 分支:
#       BOARD_BOOT_HEADER_VERSION=2
#       BOARD_INCLUDE_DTB_IN_BOOTIMG=true  (DTB 内嵌于 boot.img)
#       BOARD_KERNEL_SEPARATED_DTBO=true
#       BOARD_KERNEL_BASE=0x00000000
#       BOARD_KERNEL_PAGESIZE=4096
#       BOARD_KERNEL_IMAGE_NAME=Image
#   - postmarketOS device-xiaomi-apollo/deviceinfo:
#       deviceinfo_dtb="qcom/sm8250", append_dtb=true,
#       flash_offset_kernel=0x00008000, flash_offset_ramdisk=0x01000000
#
# 注意：若手头 MIUI 官方包为 Android 12(vendor_boot/header v3/4) 结构，以实际
# unpackbootimg 解包结果为准，勿直接套用 header v2。

# ---- boot 头（默认按 LineageOS 非 VAB：header v2）----
BOARD_BOOT_HEADER_VERSION=2

# ---- 内核/ramdisk 基准地址 ----
BOARD_KERNEL_IMAGE_NAME=Image
BOARD_KERNEL_BASE=0x00000000
BOARD_KERNEL_PAGESIZE=4096
BOARD_KERNEL_OFFSET=0x00008000
BOARD_RAMDISK_OFFSET=0x01000000
BOARD_SECOND_OFFSET=0x00000000
BOARD_TAGS_OFFSET=0x00000100

# ---- DTB / DTBO 策略 ----
BOARD_INCLUDE_DTB_IN_BOOTIMG=true
BOARD_KERNEL_SEPARATED_DTBO=true
# 内核树内 apollo 主设备树路径（主线 6.x 通常在此）：
#   arch/arm64/boot/dts/qcom/sm8250-xiaomi-apollo.dtb
# 若你的 base 用的是 pmOS kernel，则为对应的 qcom/sm8250 dtb。

# ---- cmdline（以 unpackbootimg 解包真实值为准；此处为 sm8250-common 参考值）----
BOARD_KERNEL_CMDLINE="\
androidboot.hardware=qcom \
androidboot.console=ttyMSM0 \
androidboot.memcg=1 \
lpm_levels.sleep_disabled=1 \
service_locator.enable=1 \
androidboot.usbcontroller=a600000.dwc3 \
swiotlb=2048 \
loop.max_part=7 \
cgroup.memory=nokmem \
reboot=panic_warm"